name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: "sk-test-ci-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check app/ tests/ benchmarks/
      - name: Test (mocked suite — live E2E tests are excluded by default, see pyproject.toml)
        run: PYTHONPATH=. pytest tests/ -v --tb=short
      - name: Benchmark sanity check (dry-run, no server needed)
        run: PYTHONPATH=. python benchmarks/run_benchmark.py --dry-run
